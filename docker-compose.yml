# Servicios de apoyo. La base de datos (Azure SQL) y Qdrant (Qdrant Cloud) son externos y se configuran en .env.
#   docker compose up -d otel-collector jaeger                     -> infraestructura
#   docker compose --profile migrar run --rm liquibase             -> aplica db/changelog sobre Azure SQL
#   docker compose --profile app up --build                        -> API + UI en http://localhost:8000
services:
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["16686:16686"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./infra/otel-collector.yaml:/etc/otel/config.yaml:ro"]
    ports: ["4317:4317"]
    depends_on: [jaeger]

  liquibase:
    profiles: ["migrar"]
    image: liquibase/liquibase:4.29
    working_dir: /liquibase/db
    volumes: ["./db:/liquibase/db:ro"]
    environment:
      LIQUIBASE_COMMAND_URL: "jdbc:sqlserver://${AZURE_SQL_SERVER};databaseName=${AZURE_SQL_DATABASE};encrypt=true;trustServerCertificate=false"
      LIQUIBASE_COMMAND_USERNAME: ${AZURE_SQL_USER}
      LIQUIBASE_COMMAND_PASSWORD: ${AZURE_SQL_PASSWORD}
    command: ["--defaults-file=liquibase.properties", "update"]

  api:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports: ["8000:8000"]
    volumes: ["./evidencia:/app/evidencia", "./datos:/app/datos"]
    depends_on: [otel-collector]
