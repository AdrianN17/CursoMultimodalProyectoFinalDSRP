# Liquibase: la conexión llega por variables de entorno (LIQUIBASE_COMMAND_URL / _USERNAME / _PASSWORD),
# definidas en docker-compose.yml desde .env. Nunca credenciales en el repositorio.
changelog-file=changelog/db.changelog-master.yaml
contexts=catalogo
# Esquema propio del proyecto (debe coincidir con AZURE_SQL_SCHEMA). Los cambios tipados y ${database.defaultSchemaName}
# lo usan, y las tablas DATABASECHANGELOG* quedan en él en vez de mezclarse con las de otros proyectos en dbo.
default-schema-name=multimodal
liquibase-schema-name=multimodal
