databaseChangeLog:
  - changeSet:
      id: 005-hitl-reembolso
      author: reclamos
      comment: Aprobación humana (HITL) y efecto persistente (reembolso / anulación)
      changes:
        - createTable:
            tableName: AprobacionHitl
            columns:
              - column: {name: aprobacion_id,    type: "VARCHAR(30)",   constraints: {primaryKey: true, primaryKeyName: PK_AprobacionHitl, nullable: false}}
              - column: {name: ticket_id,        type: "VARCHAR(30)",   constraints: {nullable: false}}
              - column: {name: accion_propuesta, type: "VARCHAR(12)",   constraints: {nullable: false}}
              - column: {name: transaccion_id,   type: "VARCHAR(30)",   constraints: {nullable: false}}
              - column: {name: monto,            type: "DECIMAL(12,2)", constraints: {nullable: false}}
              - column: {name: rol_requerido,    type: "VARCHAR(12)",   constraints: {nullable: false}}
              - column: {name: estado,           type: "VARCHAR(12)",   defaultValue: PENDIENTE, defaultValueConstraintName: DF_Aprob_estado, constraints: {nullable: false}}
              - column: {name: aprobador,        type: "VARCHAR(60)"}
              - column: {name: motivo,           type: "NVARCHAR(300)"}
              - column: {name: resumen_json,     type: "NVARCHAR(MAX)"}
              - column: {name: solicitada_en,    type: DATETIME2, defaultValueComputed: SYSUTCDATETIME(), defaultValueConstraintName: DF_Aprob_sol, constraints: {nullable: false}}
              - column: {name: expira_en,        type: DATETIME2,       constraints: {nullable: false}}
              - column: {name: resuelta_en,      type: DATETIME2}
        - addForeignKeyConstraint:
            constraintName: FK_Aprob_Ticket
            baseTableName: AprobacionHitl
            baseColumnNames: ticket_id
            referencedTableName: Ticket
            referencedColumnNames: ticket_id
        - addForeignKeyConstraint:
            constraintName: FK_Aprob_Tx
            baseTableName: AprobacionHitl
            baseColumnNames: transaccion_id
            referencedTableName: Transaccion
            referencedColumnNames: transaccion_id
        - sql:
            dbms: mssql
            sql: ALTER TABLE AprobacionHitl ADD CONSTRAINT CK_Aprob_accion CHECK (accion_propuesta IN ('ANULACION','REEMBOLSO'))
        - sql:
            dbms: mssql
            sql: ALTER TABLE AprobacionHitl ADD CONSTRAINT CK_Aprob_rol CHECK (rol_requerido IN ('ANALISTA','SUPERVISOR'))
        - sql:
            dbms: mssql
            sql: ALTER TABLE AprobacionHitl ADD CONSTRAINT CK_Aprob_estado CHECK (estado IN ('PENDIENTE','APROBADA','RECHAZADA','EXPIRADA'))
        # Una sola aprobación vigente por ticket y acción
        - createIndex:
            indexName: UX_Aprob_ticket_accion
            tableName: AprobacionHitl
            unique: true
            columns:
              - column: {name: ticket_id}
              - column: {name: accion_propuesta}

        - createTable:
            tableName: Reembolso
            columns:
              - column: {name: reembolso_id,      type: "VARCHAR(30)",   constraints: {primaryKey: true, primaryKeyName: PK_Reembolso, nullable: false}}
              - column: {name: ticket_id,         type: "VARCHAR(30)",   constraints: {nullable: false}}
              - column: {name: transaccion_id,    type: "VARCHAR(30)",   constraints: {nullable: false}}
              - column: {name: tipo,              type: "VARCHAR(12)",   constraints: {nullable: false}}
              - column: {name: monto,             type: "DECIMAL(12,2)", constraints: {nullable: false}}
              - column: {name: medio,             type: "VARCHAR(24)",   constraints: {nullable: false}}
              - column: {name: estado,            type: "VARCHAR(12)",   defaultValue: PROGRAMADO, defaultValueConstraintName: DF_Reemb_estado, constraints: {nullable: false}}
              - column: {name: sla_dias_habiles,  type: INT,             constraints: {nullable: false}}
              - column: {name: fecha_estimada,    type: DATE,            constraints: {nullable: false}}
              - column: {name: creado_en,         type: DATETIME2, defaultValueComputed: SYSUTCDATETIME(), defaultValueConstraintName: DF_Reemb_creado, constraints: {nullable: false}}
        - addForeignKeyConstraint:
            constraintName: FK_Reemb_Ticket
            baseTableName: Reembolso
            baseColumnNames: ticket_id
            referencedTableName: Ticket
            referencedColumnNames: ticket_id
        - addForeignKeyConstraint:
            constraintName: FK_Reemb_Tx
            baseTableName: Reembolso
            baseColumnNames: transaccion_id
            referencedTableName: Transaccion
            referencedColumnNames: transaccion_id
        - sql:
            dbms: mssql
            sql: ALTER TABLE Reembolso ADD CONSTRAINT CK_Reemb_tipo CHECK (tipo IN ('REEMBOLSO','ANULACION'))
        - sql:
            dbms: mssql
            sql: ALTER TABLE Reembolso ADD CONSTRAINT CK_Reemb_estado CHECK (estado IN ('PROGRAMADO','PAGADO'))
        # Una sola anulación/reembolso por reclamo (política P-05)
        - createIndex:
            indexName: UX_Reembolso_ticket
            tableName: Reembolso
            unique: true
            columns:
              - column: {name: ticket_id}
      rollback:
        - dropTable: {tableName: Reembolso}
        - dropTable: {tableName: AprobacionHitl}
