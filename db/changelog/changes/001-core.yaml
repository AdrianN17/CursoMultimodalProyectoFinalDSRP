databaseChangeLog:
  - changeSet:
      id: 001-core-cliente-cuenta-tarjeta
      author: reclamos
      comment: Núcleo bancario sintético (Cliente, Cuenta, Balance, Tarjeta)
      changes:
        - createTable:
            tableName: Cliente
            columns:
              - column: {name: cliente_id,  type: "VARCHAR(20)",  constraints: {primaryKey: true, primaryKeyName: PK_Cliente, nullable: false}}
              - column: {name: nombre_mask, type: "NVARCHAR(60)", constraints: {nullable: false}}
              - column: {name: doc_hash,    type: "CHAR(64)",     constraints: {nullable: false}}
              - column: {name: email_mask,  type: "NVARCHAR(80)", constraints: {nullable: false}}
              - column: {name: segmento,    type: "VARCHAR(20)",  constraints: {nullable: false}}
              - column: {name: estado,      type: "VARCHAR(12)",  defaultValue: ACTIVO, defaultValueConstraintName: DF_Cliente_estado, constraints: {nullable: false}}
              - column: {name: caso_id,     type: "VARCHAR(30)"}
              - column: {name: semilla,     type: INT}
              - column: {name: creado_en,   type: DATETIME2, defaultValueComputed: SYSUTCDATETIME(), defaultValueConstraintName: DF_Cliente_creado, constraints: {nullable: false}}
        - sql:
            dbms: mssql
            sql: ALTER TABLE Cliente ADD CONSTRAINT CK_Cliente_estado CHECK (estado IN ('ACTIVO','BLOQUEADO'))

        - createTable:
            tableName: Cuenta
            columns:
              - column: {name: cuenta_id,  type: "VARCHAR(20)", constraints: {primaryKey: true, primaryKeyName: PK_Cuenta, nullable: false}}
              - column: {name: cliente_id, type: "VARCHAR(20)", constraints: {nullable: false}}
              - column: {name: tipo,       type: "VARCHAR(12)", constraints: {nullable: false}}
              - column: {name: moneda,     type: "CHAR(3)",     constraints: {nullable: false}}
              - column: {name: estado,     type: "VARCHAR(12)", defaultValue: ACTIVA, defaultValueConstraintName: DF_Cuenta_estado, constraints: {nullable: false}}
        - addForeignKeyConstraint:
            constraintName: FK_Cuenta_Cliente
            baseTableName: Cuenta
            baseColumnNames: cliente_id
            referencedTableName: Cliente
            referencedColumnNames: cliente_id
        - sql:
            dbms: mssql
            sql: ALTER TABLE Cuenta ADD CONSTRAINT CK_Cuenta_tipo CHECK (tipo IN ('AHORROS','CORRIENTE','TARJETA'))
        - sql:
            dbms: mssql
            sql: ALTER TABLE Cuenta ADD CONSTRAINT CK_Cuenta_moneda CHECK (moneda = 'PEN')
        - sql:
            dbms: mssql
            sql: ALTER TABLE Cuenta ADD CONSTRAINT CK_Cuenta_estado CHECK (estado IN ('ACTIVA','CERRADA'))

        - createTable:
            tableName: Balance
            columns:
              - column: {name: cuenta_id,        type: "VARCHAR(20)",   constraints: {primaryKey: true, primaryKeyName: PK_Balance, nullable: false}}
              - column: {name: saldo,            type: "DECIMAL(14,2)", constraints: {nullable: false}}
              - column: {name: saldo_disponible, type: "DECIMAL(14,2)", constraints: {nullable: false}}
              - column: {name: actualizado_en,   type: DATETIME2, defaultValueComputed: SYSUTCDATETIME(), defaultValueConstraintName: DF_Balance_act, constraints: {nullable: false}}
        - addForeignKeyConstraint:
            constraintName: FK_Balance_Cuenta
            baseTableName: Balance
            baseColumnNames: cuenta_id
            referencedTableName: Cuenta
            referencedColumnNames: cuenta_id

        - createTable:
            tableName: Tarjeta
            columns:
              - column: {name: tarjeta_id,      type: "VARCHAR(20)",  constraints: {primaryKey: true, primaryKeyName: PK_Tarjeta, nullable: false}}
              - column: {name: cuenta_id,       type: "VARCHAR(20)",  constraints: {nullable: false}}
              - column: {name: ultimos4,        type: "CHAR(4)",      constraints: {nullable: false}}
              - column: {name: producto,        type: "NVARCHAR(40)", constraints: {nullable: false}}
              - column: {name: habilitada,      type: BIT, defaultValueBoolean: true, defaultValueConstraintName: DF_Tarjeta_hab, constraints: {nullable: false}}
              - column: {name: dia_facturacion, type: TINYINT, constraints: {nullable: false}}
        - addForeignKeyConstraint:
            constraintName: FK_Tarjeta_Cuenta
            baseTableName: Tarjeta
            baseColumnNames: cuenta_id
            referencedTableName: Cuenta
            referencedColumnNames: cuenta_id
        - sql:
            dbms: mssql
            sql: ALTER TABLE Tarjeta ADD CONSTRAINT CK_Tarjeta_dia CHECK (dia_facturacion BETWEEN 1 AND 28)
      rollback:
        - dropTable: {tableName: Tarjeta}
        - dropTable: {tableName: Balance}
        - dropTable: {tableName: Cuenta}
        - dropTable: {tableName: Cliente}
