databaseChangeLog:
  - changeSet:
      id: 009-transaccion-autenticacion-otp
      author: reclamos
      comment: Indica si la operación original se autenticó con OTP (1) o se procesó sin OTP (0); dato maestro de fraude (P-11)
      changes:
        - addColumn:
            tableName: Transaccion
            columns:
              - column: {name: autenticada_otp, type: BIT, defaultValueBoolean: true, defaultValueConstraintName: DF_Tx_otp, constraints: {nullable: false}}
      rollback:
        - sql:
            dbms: mssql
            sql: ALTER TABLE Transaccion DROP CONSTRAINT DF_Tx_otp; ALTER TABLE Transaccion DROP COLUMN autenticada_otp;
