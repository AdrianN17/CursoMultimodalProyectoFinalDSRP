databaseChangeLog:
  - changeSet:
      id: 001-core-cliente-cuenta-tarjeta
      author: reclamos
      changes:
        - sqlFile:
            path: sql/001_core.sql
            relativeToChangelogFile: true
            splitStatements: true
            endDelimiter: ";"
            stripComments: true
      rollback:
